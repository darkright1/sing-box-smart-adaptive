name: iWAN native Linux

on:
  push:
    branches:
      - private/iwan-v1.15
    paths:
      - 'native/iwan/**'
      - 'protocol/iwan/**'
      - 'transport/iwan/**'
      - 'option/iwan.go'
      - 'include/iwan*.go'
      - '.github/workflows/iwan-native.yml'
  pull_request:
    paths:
      - 'native/iwan/**'
      - 'protocol/iwan/**'
      - 'transport/iwan/**'
      - 'option/iwan.go'
      - 'include/iwan*.go'
      - '.github/workflows/iwan-native.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Verify Rust ABI and build static library
        run: make -C native/iwan test && make -C native/iwan build TARGET=x86_64-unknown-linux-gnu
      - name: Go fallback tests
        run: go test -tags with_iwan ./protocol/iwan ./transport/iwan
      - name: Go native tests and race checks
        run: |
          CGO_ENABLED=1 go test -tags 'with_iwan,with_iwan_native' ./protocol/iwan ./transport/iwan
          go test -race -tags with_iwan ./protocol/iwan ./transport/iwan
      - name: Build private native binary
        run: make build_iwan_native IWAN_NATIVE_TARGET=x86_64-unknown-linux-gnu
